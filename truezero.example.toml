# TrueZero settings: the ONE file every program reads (server, main, trainenginetest,
# the launcher, client.py and the ladder).
#
# This file holds every setting and its default. Your own settings go in `truezero.toml`
# next to it (created from this file the first time anything starts; it is not committed).
# `truezero.toml` only needs the keys you change: anything missing falls back to the value
# here. An unknown key, or a value of the wrong type, is an error, so a typo cannot be
# silently ignored.
#
# Start (or resume) everything with one command, from the repository root:
#
#     cargo run --release --bin truezero              # resume the current run
#     cargo run --release --bin truezero -- reset     # start a fresh run
#
# Each run lives in its own folder, runs/<name>-<YYYYMMDD-HHMM> (UTC), and that folder name
# is also the W&B run name, so a rerun never collides with an earlier one. Old runs are
# never deleted. The run folder keeps a copy of truezero.toml and the git commit
# (run.json); editing truezero.toml mid-run is allowed and is recorded in
# hidden/config_history/.

[run]
# Runs are named <name>-<timestamp>. Runs with the same name are grouped together in W&B.
name = "truenet-128x10"
# Seeds the trainer's torch/numpy/random. Self-play RNG is per thread and not seeded.
seed = 0

[net]
# The network a fresh run starts from (nets/tz_0.pt is created from this).
# "TrueNet" (pre-activation ResNet) or "TrueNetXS" (the small 6x64 net).
arch = "TrueNet"
blocks = 10
channels = 128

[server]
# Where the server listens and the other programs connect.
host = "127.0.0.1"
port = 38475

[selfplay]
# Concurrent self-play games.
num_generators = 1024
# Leaves gathered per MCTS step with virtual loss. 1 = plain MCTS.
virtual_leaves = 8
# GPU executor threads and their batch size (throughput only).
num_executors = 2
batch_size = 2048
# Microseconds an executor waits for one more request before running a partial batch.
batch_timeout_us = 1
# Visits per full search.
max_nodes = 1600
root_fpu = 1.0
children_fpu = 0.5
root_c_puct = 2.0
children_c_puct = 2.0
# Policy softmax sharpening, p^pst (intentionally > 1).
root_pst = 1.5
children_pst = 1.5
dirichlet_alpha = 0.03
dirichlet_eps = 0.25
moves_left_weight = 0.05
moves_left_clip = 20.0
moves_left_sharpness = 0.5
# Playout cap randomisation. pcr_full_prob = 1.0 turns it off.
pcr_full_prob = 0.25
pcr_fast_visits = 200
pcr_early_stop = true

[gate]
# Opening book for the gate (trainenginetest), relative to the repository root. Downloaded
# from github.com/official-stockfish/books by the launcher if missing.
openings = "books/8moves_v3.epd"

[trainer]
buffer_size = 1500000
batch_size = 2048
min_buffer_to_train = 250000
epochs_per_gen = 1.0
recent_batch_fraction = 0.5
min_training_steps = 16
startup_training_steps = 16
test_fraction = 0.2
# "samples:lr,..." from sample 0; K/M/B suffixes.
lr_schedule = "0:1e-3,50M:5e-4,100M:2.5e-4,200M:1e-4"
# Warm-up length in samples, "0" disables.
lr_warmup_samples = "1M"
weight_decay = 1e-4
value_weight = 1.0
wdl_weight = 1.0
moves_left_weight = 0.1
moves_left_delta = 0.1
policy_weight = 1.0
clip_norm = 5.0

[wandb]
# "online", "offline" (local files; `wandb sync` later) or "off".
# Online needs a W&B login once per machine (`uv run wandb login`); without one the
# trainer does not prompt, it logs offline and says so.
mode = "online"
project = "truezero"
# W&B team or user; "" = your default entity.
entity = ""
# How often the server/self-play throughput lines are averaged into W&B.
flush_seconds = 60.0

[ladder]
# Every `every_accepted_nets` accepted nets, the trainer runs the `ladder` binary in the
# background: a fixed-node match of the new net against each anchor, and the tactics
# suite. Results go to W&B as ladder/* and to hidden/ladder.jsonl in the run folder.
enabled = false
every_accepted_nets = 5
# Each anchor: a net path (relative to the repository root, e.g. "anchors/tz_18.pt"),
# "random" (uniform random legal moves), or "stockfish:<path>:<skill 0-20>".
anchors = ["random"]
games = 100
nodes = 200
# Relative to the repository root.
openings = "books/8moves_v3.epd"
# Tactics suite (EPD with bm), "" = the bundled src/python/eval/mate_suite.txt.
tactics = ""
tactics_nodes = 400

[launcher]
# How the launcher starts the trainer (client.py, run from src/python).
python = ["uv", "run", "python"]
# Folder for the Python environment, passed to uv as UV_PROJECT_ENVIRONMENT. Keep it on a
# local disk if the repository is on a network drive (numpy's DLLs fail to load from a
# share), e.g. 'C:\venvs\truezero'. "" = uv's default (.venv in the repository).
venv = ""
# Restart a program that crashes (a program asked to restart for a new run always is).
restart_on_crash = true

[paths]
# Folder holding one sub-folder per run, plus logs/ (relative to the repository root, or
# absolute).
runs_dir = "runs"
