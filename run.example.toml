# TrueZero run configuration: what a training run IS.
#
# Copy this file to `<data root>/run.toml` (the data root is the project root, or
# $env:TZ_DATA_ROOT if set) and edit it BEFORE the first start. The run directory holds
# run.toml, nets/, games/, hidden/ and python_client_games/, so two runs (or two branches
# of a run) never share replay files: give each its own data root.
#
# The run is frozen on first start: `hidden/run_lock.json` records the SHA-256 of this
# file's bytes and the git commit. Afterwards the trainer (client.py) and self-play
# (main) refuse to start if this file changed (any edit, even a comment) or the code is at
# a different commit; uncommitted changes to tracked files only warn (logged as git_dirty).
# Overrides, for when you really mean it:
#   --allow-config-change   run.toml differs from the locked one
#   --allow-code-change     different (or unknown) commit
# Every start, with any override used, is appended to `hidden/run_log.jsonl`.
#
# Every key below is required, and unknown keys are an error, so a typo cannot silently
# fall back to a default. The old TZ_* variables for these settings (TZ_PCR_*,
# TZ_VIRTUAL_LEAVES, TZ_NUM_GENERATORS, TZ_LR_*) have no effect: a start that finds one
# set prints a warning and uses this file. The values below are the defaults the code
# used before this file existed.
#
# Not in here (so they can change mid-run): TZ_SERVER_HOST/PORT, TZ_DEVICE,
# TZ_DATA_ROOT, the executor knobs TZ_NUM_EXECUTORS and TZ_BATCH_TIMEOUT_US (throughput
# only), and observe.toml (W&B, log tailing, anchor ladder). The gate (trainenginetest,
# 55% SPRT) is code, pinned by the git commit.

[run]
# Name of this run. Must not change once the run has started.
run_id = "truenet-128x10-a"
# For a branch: the run_id it was forked from and the samples trained at the fork
# point. "" and 0 for a root run.
parent_run_id = ""
fork_sample = 0
# Seeds the trainer's torch/numpy/random. Self-play RNG is per thread and not seeded.
seed = 0

[selfplay]
# Concurrent self-play games (was TZ_NUM_GENERATORS; default 2 x batch size 2048).
num_generators = 4096
# Leaves gathered per MCTS step with virtual loss (was TZ_VIRTUAL_LEAVES). 1 = plain MCTS.
virtual_leaves = 1
# Visits per full search.
max_nodes = 1600
root_fpu = 1.0
children_fpu = 0.5
root_c_puct = 2.0
children_c_puct = 2.0
root_pst = 1.5
children_pst = 1.5
dirichlet_alpha = 0.03
dirichlet_eps = 0.25
moves_left_weight = 0.05
moves_left_clip = 20.0
moves_left_sharpness = 0.5
# Playout cap randomisation (was TZ_PCR_*). pcr_full_prob = 1.0 turns it off.
pcr_full_prob = 0.25
pcr_fast_visits = 200
pcr_early_stop = true

[trainer]
buffer_size = 1500000
batch_size = 2048
min_buffer_to_train = 250000
epochs_per_gen = 1.0
recent_batch_fraction = 0.5
min_training_steps = 16
startup_training_steps = 16
test_fraction = 0.2
# "samples:lr,..." from sample 0; K/M/B suffixes (was TZ_LR_SCHEDULE).
lr_schedule = "0:1e-3,50M:5e-4,100M:2.5e-4,200M:1e-4"
# Warm-up length in samples, 0 disables (was TZ_LR_WARMUP_SAMPLES).
lr_warmup_samples = "1M"
weight_decay = 1e-4
value_weight = 1.0
wdl_weight = 1.0
moves_left_weight = 0.1
moves_left_delta = 0.1
policy_weight = 1.0
clip_norm = 5.0
